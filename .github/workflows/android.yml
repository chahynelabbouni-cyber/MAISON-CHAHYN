name: Construire l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Compiler
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk MaisonChahyn.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MaisonChahyn-apk
          path: MaisonChahyn.apk
      - name: Publier l'APK (dernière version)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.ref_name }}
          name: Maison Chahyn — dernière version (${{ github.ref_name }})
          prerelease: true
          make_latest: false
          files: MaisonChahyn.apk
          body: |
            Télécharge **MaisonChahyn.apk** depuis ton Galaxy et installe-le.
            Build n°${{ github.run_number }} — commit ${{ github.sha }}
