name: Construire l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compiler
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk MaisonChahyn.apk
          cp photo/build/outputs/apk/release/photo-release.apk ChahynPhoto.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MaisonChahyn-apk
          path: MaisonChahyn.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ChahynPhoto-apk
          path: ChahynPhoto.apk
      - name: Publier Chahyn Photo (appli séparée)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chahyn-photo
          target_commitish: ${{ github.sha }}
          name: 📷 Chahyn Photo — appareil photo
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: ChahynPhoto.apk
          body: |
            **Chahyn Photo** — l'appareil photo qui se règle tout seul (appli séparée de Maison Chahyn).
            Télécharge **ChahynPhoto.apk** depuis ton Galaxy et installe-le.
            Build n°${{ github.run_number }} — commit ${{ github.sha }}
      - name: Publier l'APK (dernière version)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.ref_name }}
          name: Maison Chahyn — dernière version (${{ github.ref_name }})
          prerelease: true
          make_latest: false
          files: MaisonChahyn.apk
          body: |
            Télécharge **MaisonChahyn.apk** depuis ton Galaxy et installe-le.
            Build n°${{ github.run_number }} — commit ${{ github.sha }}
