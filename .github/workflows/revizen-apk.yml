name: Build RéviZen APK
on:
  push:
    paths: ["revizen-app/**", ".github/workflows/revizen-apk.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Sync web app into assets
        run: cp revizen-app/index.html revizen-app/android/app/src/main/assets/index.html
      - name: Build APK
        working-directory: revizen-app/android
        run: gradle assembleDebug --no-daemon
      - run: cp revizen-app/android/app/build/outputs/apk/debug/app-debug.apk RevizenApp.apk
      - uses: actions/upload-artifact@v4
        with: { name: RevizenApp-apk, path: RevizenApp.apk }
